version: "3.9"

services:

  # ── Zookeeper (مطلوب لـ Kafka) ─────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── Kafka Broker ───────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Producer (يعمل كل 6 أشهر) ─────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_producer
    depends_on:
      kafka:
        condition: service_healthy
    command: python producer/aqarmap_producer.py
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./output:/app/output

  # ── Consumer (يشتغل بعد الـ Producer) ─────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_consumer
    depends_on:
      kafka:
        condition: service_healthy
    command: python consumer/aqarmap_consumer.py
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./output:/app/output     # ← الـ Excel بيتحفظ هنا
