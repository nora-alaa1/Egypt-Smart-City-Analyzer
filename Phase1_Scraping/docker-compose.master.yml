version: "3.9"

# ╔══════════════════════════════════════════════════════════════════╗
# ║     Egypt Smart City Analyzer — Master Kafka Orchestrator        ║
# ║     5 Pipelines · 1 Shared Broker · All Topics                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Topics created automatically:
#   rent-commercial-alexandria    ← Pipeline 01 (Aqarmap)
#   osm-cafes-alexandria          ← Pipeline 02 (OSM)
#   osm-gyms-alexandria           ← Pipeline 02 (OSM)
#   pharmacy-alexandria           ← Pipeline 02 (Egyfinder)
#   schools-alexandria            ← Pipeline 03 (OSM Education)
#   centers-alexandria            ← Pipeline 03 (OSM Education)
#   population-alexandria         ← Pipeline 04 (CAPMAS + GEE)
#   traffic-nodes-alexandria      ← Pipeline 05 (OSMnx + SQLite)
#   traffic-edges-alexandria      ← Pipeline 05 (OSMnx + SQLite)
#
# Run:  docker compose -f docker-compose.master.yml up --build
# ─────────────────────────────────────────────────────────────────────

x-kafka-env: &kafka-env
  KAFKA_BROKER: kafka:9092

x-depends-kafka: &depends-kafka
  depends_on:
    kafka:
      condition: service_healthy

x-output-vol: &output-vol
  - ./output_all:/app/output

x-data-vol: &data-vol
  - ../../../../Data:/app/data:ro

services:

  # ══════════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 2160       # 90 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824   # 1 GB per segment
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: SmartCityAlexandria
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ══════════════════════════════════════════════
  # PIPELINE 01 — Rental Data (Aqarmap)
  # Source: aqarmap.com.eg
  # Output: rent_commercial_alexandria_YYYYMMDD.xlsx
  # ══════════════════════════════════════════════

  rental-producer:
    build:
      context: ./pipeline_01_rental
      dockerfile: Dockerfile
    container_name: rental_producer
    restart: on-failure
    <<: *depends-kafka
    command: python producer/aqarmap_producer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  rental-consumer:
    build:
      context: ./pipeline_01_rental
      dockerfile: Dockerfile
    container_name: rental_consumer
    restart: on-failure
    <<: *depends-kafka
    command: python consumer/aqarmap_consumer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  # ══════════════════════════════════════════════
  # PIPELINE 02 — Business Data (OSM + Egyfinder)
  # Sources: OpenStreetMap Overpass API + egyfinder.net
  # Output: cafes_YYYYMMDD.xlsx / gyms_YYYYMMDD.xlsx
  #         pharmacies_YYYYMMDD.csv
  # ══════════════════════════════════════════════

  osm-producer:
    build:
      context: ./pipeline_02_business
      dockerfile: Dockerfile
    container_name: osm_producer
    restart: on-failure
    <<: *depends-kafka
    command: python producer/osm_producer.py
    environment:
      <<: *kafka-env
      STARTUP_DELAY_SEC: "30" 
    volumes: *output-vol

  pharmacy-producer:
    build:
      context: ./pipeline_02_business
      dockerfile: Dockerfile
    container_name: pharmacy_producer
    restart: on-failure
    <<: *depends-kafka
    command: python producers/pharmacy_producer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  osm-missing-producer:
    build:
      context: ./pipeline_02_business
      dockerfile: Dockerfile
    container_name: osm_missing_producer
    restart: on-failure
    <<: *depends-kafka
    command: python producers/osm_missing_producer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  business-consumer:
    build:
      context: ./pipeline_02_business
      dockerfile: Dockerfile
    container_name: business_consumer
    restart: on-failure
    <<: *depends-kafka
    command: python consumer/consumer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  # ══════════════════════════════════════════════
  # PIPELINE 03 — Education Data (OSM)
  # Sources: OpenStreetMap (schools, colleges, training)
  # Output: schools_alexandria_YYYYMMDD.xlsx
  #         centers_alexandria_YYYYMMDD.xlsx
  # ══════════════════════════════════════════════

  education-producer:
    build:
      context: ./pipeline_03_education
      dockerfile: Dockerfile
    container_name: education_producer
    restart: on-failure
    <<: *depends-kafka
    command: python education_producer.py
    environment:
      <<: *kafka-env
      STARTUP_DELAY_SEC: "60"
    volumes: *output-vol

  education-consumer:
    build:
      context: ./pipeline_03_education
      dockerfile: Dockerfile
    container_name: education_consumer
    restart: on-failure
    <<: *depends-kafka
    command: python education_consumer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  # ══════════════════════════════════════════════
  # PIPELINE 04 — Population Data (CAPMAS + GEE)
  # Sources: Local XLSX (CAPMAS) + Nightlights CSV (GEE)
  # Output: population_alexandria_YYYYMMDD.xlsx
  # ══════════════════════════════════════════════

  population-producer:
    build:
      context: ./pipeline_04_population
      dockerfile: Dockerfile
    container_name: population_producer
    restart: on-failure
    <<: *depends-kafka
    command: python population_producer.py
    environment:
      <<: *kafka-env
    volumes:
      - ./output_all:/app/output
      - ${SMARTCITY_HOST_PATH}/Data:/app/data:ro

  population-consumer:
    build:
      context: ./pipeline_04_population
      dockerfile: Dockerfile
    container_name: population_consumer
    restart: on-failure
    <<: *depends-kafka
    command: python population_consumer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  # ══════════════════════════════════════════════
  # PIPELINE 05 — Traffic Data (SQLite + OSMnx)
  # Sources: egypt_smart_city.db + OSM Overpass (roads)
  # Output: traffic_nodes_alexandria_YYYYMMDD.xlsx
  #         traffic_edges_alexandria_YYYYMMDD.xlsx
  # ══════════════════════════════════════════════

  traffic-producer:
    build:
      context: ./pipeline_05_traffic
      dockerfile: Dockerfile
    container_name: traffic_producer
    restart: on-failure
    <<: *depends-kafka
    command: python traffic_producer.py
    environment:
      <<: *kafka-env
    volumes:
      - ./output_all:/app/output
      - ${SMARTCITY_HOST_PATH}/Data:/app/data:ro

  traffic-consumer:
    build:
      context: ./pipeline_05_traffic
      dockerfile: Dockerfile
    container_name: traffic_consumer
    restart: on-failure
    <<: *depends-kafka
    command: python traffic_consumer.py
    environment:
      <<: *kafka-env
    volumes: *output-vol

  # ══════════════════════════════════════════════
  # POSTGRESQL — Bronze Layer Database
  # Port    : 5432
  # Schema  : bronze
  # DB      : smartcity
  # ══════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       smartcity
      POSTGRES_USER:     smartcity
      POSTGRES_PASSWORD: smartcity123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pipeline_bronze_postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcity -d smartcity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Bronze Loader ──────────────────────────────────────────────────────────
  # يراقب output_all ويلود كل ملف جديد لـ PostgreSQL
  bronze-loader:
    build:
      context: ./pipeline_bronze_postgres
      dockerfile: Dockerfile
    container_name: bronze_loader
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST:           postgres
      PG_PORT:           "5432"
      PG_DB:             smartcity
      PG_USER:           smartcity
      PG_PASSWORD:       smartcity123
      OUTPUT_DIR:        /app/output
      POLL_INTERVAL_SEC: "30"
    volumes:
      - ./output_all:/app/output:ro

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: smartcity_default
    driver: bridge
