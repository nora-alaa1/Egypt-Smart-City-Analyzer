version: "3.9"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  osm-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osm_producer
    depends_on:
      kafka:
        condition: service_healthy
    command: python producers/osm_producer.py
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./output:/app/output

  pharmacy-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy_producer
    depends_on:
      kafka:
        condition: service_healthy
    command: python producers/pharmacy_producer.py
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./output:/app/output

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: business_consumer
    depends_on:
      kafka:
        condition: service_healthy
    command: python consumer/consumer.py
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./output:/app/output


  osm-missing-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osm_missing_producer
    depends_on:
      kafka:
        condition: service_healthy
    command: python producers/osm_missing_producer.py
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./output:/app/output